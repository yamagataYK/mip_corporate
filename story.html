<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/main.css" />
  <title>ステップストーリー</title>
</head>

<body class="container">
  <div class="title">
    <h1>私たちの仕事、4つの物語</h1>
    <p>お客様の成功をデザインする、私たちのプロセス</p>
  </div>
  <div class="menu__btn">
    <span></span>
    <span></span>
    <span></span>
  </div>
  <div class="menu__overlay">
    <ul class="menu__list">
      <li class="menu__item"><a href="./index.html">トップページ<span class="sub">Top</span></a></li>
      <li class="menu__item"><a href="./information.html">会社案内<span class="sub">Company Profile</span></a></li>
      <li class="menu__item"><a href="./strong.html">MIPの強み<span class="sub">Strengths</span></a></li>
      <li class="menu__item"><a href="./project.html">事業内容<span class="sub">Solution</span></a></li>
      <li class="menu__item"><a href="./contact.html">お問い合わせ<span class="sub">Contact</span></a></li>
    </ul>
  </div>

  <div class="imgWrap">
    <div class="step-item" data-step="ヒアリング">
      <img src="./img/step1.png" alt="ヒアリング写真" class="imgWrap__step1-image img" />
      <p>ヒアリング</p>
    </div>
    <div class="step-item" data-step="企画">
      <img src="./img/step2.jpg" alt="企画写真" class="imgWrap__step2-image img" />
      <p>企画</p>
    </div>
    <div class="step-item" data-step="制作">
      <img src="./img/step3.jpg" alt="制作写真" class="imgWrap__step3-image img" />
      <p>制作</p>
    </div>
    <div class="step-item" data-step="運用">
      <img src="./img/step4.jpg" alt="運用写真" class="imgWrap__step4-image img" />
      <p>運用</p>
    </div>
  </div>

  <!-- モーダル全体 -->
  <div id="fullscreenModal" class="modal hidden">
    <button id="closeModal" class="modal__close-button">✕</button>

    <div class="modal__content">

      <section class="modal__hero">
        <img id="fullscreenImage" src="" alt="ステップ画像" />
        <div class="modal__hero-overlay">
          <div class="modal__hero-text">
            <h2 id="modalTitle"></h2>
            <p id="modalDescription"></p>
            <div class="voiceWrap">
              <img src="./img/user.png" alt="">
              <div class="voiceContents">
                <p>お客様の声</p>
                <div class="modal__voice" id="modalVoice"></div>
              </div>
            </div>
          </div>
        </div>
      </section>


      <section class="modal__story" id="modalScrollContent">

      </section>
    </div>
  </div>
  <script src="js/story.js"></script>
</body>

</html>
